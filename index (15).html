<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مِحراب</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --primary: #1a472a; --secondary: #c5a059; --bg: #f4f7f6; }
        body { background: var(--bg); font-family: sans-serif; margin: 0; direction: rtl; }
        .top-nav { background: var(--primary); color: white; padding: 15px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 100; }
        .hamburger { font-size: 24px; background: none; border: none; color: white; cursor: pointer; }
        .sidebar { position: fixed; top: 0; left: -250px; width: 250px; height: 100%; background: var(--primary); transition: 0.3s; z-index: 1001; padding-top: 60px; }
        .sidebar.active { left: 0; }
        .sidebar a { display: block; color: white; padding: 15px; text-decoration: none; cursor: pointer; border-bottom: 1px solid rgba(255,255,255,0.1); }
        .overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); display: none; z-index: 1000; }
        .overlay.active { display: block; }
        .page { display: none; padding: 20px; max-width: 800px; margin: 0 auto; }
        .page.active { display: block; }
        .home-container { text-align: center; padding-top: 50px; }
        .mosque-btns { display: flex; gap: 20px; justify-content: center; margin-top: 30px; }
        .btn-mosque { padding: 20px; cursor: pointer; border: 2px solid var(--primary); background: white; color: var(--primary); border-radius: 10px; font-weight: bold; }
        .recitation-card { background: white; padding: 15px; margin-bottom: 15px; border-radius: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .admin-form { background: white; padding: 20px; border-radius: 10px; display: flex; flex-direction: column; gap: 10px; }
        .btn-submit { background: var(--primary); color: white; padding: 10px; border: none; border-radius: 5px; cursor: pointer; }
        .auth-container { max-width: 400px; margin: 50px auto; background: white; padding: 30px; border-radius: 10px; text-align: center; }
        .auth-container input { width: 100%; padding: 10px; margin-bottom: 10px; }
    </style>
</head>
<body>
    <nav class="top-nav">
        <div style="display:flex; align-items:center; gap:10px;">
            <button class="hamburger" onclick="toggleSidebar()">☰</button>
            <span style="font-weight:bold; font-size:1.2rem;">مِحراب</span>
        </div>
        <div id="user-status"></div>
    </nav>
    <div class="overlay" id="overlay" onclick="toggleSidebar()"></div>
    <div class="sidebar" id="sidebar">
        <a onclick="showPage('home')">الرئيسية</a>
        <a onclick="showPage('haram')">المسجد الحرام</a>
        <a onclick="showPage('nabawi')">المسجد النبوي</a>
        <a onclick="showPage('admin')">لوحة التحكم</a>
        <a id="logout-btn" onclick="handleLogout()" style="display:none; color:red;">خروج</a>
    </div>
    <div id="home" class="page active">
        <div class="home-container">
            <h1>مرحباً بكم في مِحراب</h1>
            <div class="mosque-btns">
                <button class="btn-mosque" onclick="showPage('haram')">المسجد الحرام</button>
                <button class="btn-mosque" onclick="showPage('nabawi')">المسجد النبوي</button>
            </div>
        </div>
    </div>
    <div id="mosque-view" class="page">
        <h2 id="mosque-title" style="text-align:center"></h2>
        <div class="filter-bar" style="text-align:center; margin-bottom:20px;">
            <select id="prayer-filter" onchange="filterRecitations()">
                <option value="all">كل الصلوات</option>
                <option value="الفجر">الفجر</option>
                <option value="المغرب">المغرب</option>
                <option value="العشاء">العشاء</option>
            </select>
        </div>
        <div id="recitations-list"></div>
    </div>
    <div id="admin" class="page">
        <h2>لوحة الإدارة</h2>
        <div class="admin-form">
            <input type="text" id="reciter-name" placeholder="اسم القارئ">
            <input type="text" id="surah-name" placeholder="اسم السورة">
            <select id="mosque-select">
                <option value="المسجد الحرام">المسجد الحرام</option>
                <option value="المسجد النبوي">المسجد النبوي</option>
            </select>
            <select id="prayer-select">
                <option value="الفجر">الفجر</option>
                <option value="المغرب">المغرب</option>
                <option value="العشاء">العشاء</option>
            </select>
            <input type="file" id="audio-file" accept="audio/*">
            <button class="btn-submit" onclick="uploadRecitation()">نشر التلاوة</button>
        </div>
        <div id="admin-entries" style="margin-top:20px"></div>
    </div>
    <div id="auth" class="page">
        <div class="auth-container">
            <h2 id="auth-title">تسجيل الدخول</h2>
            <input type="email" id="auth-email" placeholder="الإيميل">
            <input type="password" id="auth-password" placeholder="كلمة المرور">
            <button class="btn-submit" style="width:100%" id="auth-main-btn" onclick="handleAuth()">دخول</button>
            <p class="auth-toggle" id="auth-toggle" onclick="toggleAuthMode()" style="cursor:pointer; color:blue; margin-top:10px;">إنشاء حساب</p>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://wbjgotyjxlnkgxkamvet.supabase.co/';
        const SUPABASE_KEY = 'sb_publishable_odJSX2nIpjMMndVAzJSnWA_o5DuKrcH';
        
        // تم تصحيح اسم المتغير هنا ليتجنب التعارض مع اسم المكتبة
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
        
        let currentMosque='', isLoginMode=true, currentUser=null, allRecs=[];

        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('active');
            document.getElementById('overlay').classList.toggle('active');
        }

        function showPage(id) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.getElementById('overlay').classList.remove('active');
            document.getElementById('sidebar').classList.remove('active');
            if (id === 'haram' || id === 'nabawi') {
                currentMosque = (id === 'haram') ? 'المسجد الحرام' : 'المسجد النبوي';
                document.getElementById('mosque-title').innerText = currentMosque;
                document.getElementById('mosque-view').classList.add('active');
                loadRecs();
            } else if (id === 'admin') {
                checkAdmin();
            } else {
                document.getElementById(id).classList.add('active');
            }
        }

        function toggleAuthMode() {
            isLoginMode = !isLoginMode;
            document.getElementById('auth-title').innerText = isLoginMode ? 'تسجيل الدخول' : 'إنشاء حساب';
            document.getElementById('auth-main-btn').innerText = isLoginMode ? 'دخول' : 'تسجيل';
            document.getElementById('auth-toggle').innerText = isLoginMode ? 'إنشاء حساب' : 'دخول';
        }

        async function handleAuth() {
            const email = document.getElementById('auth-email').value;
            const password = document.getElementById('auth-password').value;
            if (isLoginMode) {
                const { error } = await supabaseClient.auth.signInWithPassword({ email, password });
                if (error) alert(error.message); else { checkSession(); showPage('home'); }
            } else {
                const { error } = await supabaseClient.auth.signUp({ email, password });
                if (error) alert(error.message); else alert('تم التسجيل!');
            }
        }

        async function checkSession() {
            const { data: { session } } = await supabaseClient.auth.getSession();
            currentUser = session?.user || null;
            document.getElementById('user-status').innerText = currentUser ? currentUser.email : '';
            document.getElementById('logout-btn').style.display = currentUser ? 'block' : 'none';
        }

        async function handleLogout() {
            await supabaseClient.auth.signOut();
            currentUser = null; checkSession(); showPage('home');
        }

        async function checkAdmin() {
            if (!currentUser) { showPage('auth'); return; }
            const { data } = await supabaseClient.from('mihrab_admins').select('user_id').eq('user_id', currentUser.id).single();
            if (!data) { alert('غير مصرح لك'); showPage('home'); return; }
            document.getElementById('admin').classList.add('active');
            loadAdminEntries();
        }

        async function uploadRecitation() {
            const reciter = document.getElementById('reciter-name').value;
            const surah = document.getElementById('surah-name').value;
            const mosque = document.getElementById('mosque-select').value;
            const prayer = document.getElementById('prayer-select').value;
            const file = document.getElementById('audio-file').files[0];
            if (!reciter || !surah || !file) return alert('أكمل البيانات');
            
            const fileName = `${Date.now()}_${file.name}`;
            const { error: uErr } = await supabaseClient.storage.from('recitations').upload(fileName, file);
            if (uErr) return alert(uErr.message);
            
            const { data: urlData } = supabaseClient.storage.from('recitations').getPublicUrl(fileName);
            const { error: dbErr } = await supabaseClient.from('recitations').insert([{ reciter, surah, mosque, prayer, storage_path: urlData.publicUrl }]);
            
            if (dbErr) alert(dbErr.message); else { alert('تم النشر!'); loadAdminEntries(); }
        }

        async function loadAdminEntries() {
            const { data } = await supabaseClient.from('recitations').select('*').order('created_at', { ascending: false });
            const container = document.getElementById('admin-entries');
            container.innerHTML = '';
            data.forEach(item => {
                container.innerHTML += `<div class="entry-item" style="display:flex; justify-content:space-between; background:#eee; padding:10px; margin-top:5px;">${item.reciter} - ${item.surah} <button onclick="deleteRec(${item.id})" style="color:red">حذف</button></div>`;
            });
        }

        async function deleteRec(id) {
            if (!confirm('حذف؟')) return;
            await supabaseClient.from('recitations').delete().eq('id', id);
            loadAdminEntries();
        }

        async function loadRecs() {
            const { data } = await supabaseClient.from('recitations').select('*').eq('mosque', currentMosque);
            allRecs = data || [];
            filterRecitations();
        }

        function filterRecitations() {
            const prayer = document.getElementById('prayer-filter').value;
            const list = document.getElementById('recitations-list');
            list.innerHTML = '';
            const filtered = prayer === 'all' ? allRecs : allRecs.filter(r => r.prayer === prayer);
            filtered.forEach(r => {
                list.innerHTML += `<div class="recitation-card"><div class="recitation-info">${r.reciter} - ${r.surah} (${r.prayer})</div><audio controls src="${r.storage_path}" style="width:100%"></audio></div>`;
            });
        }
        window.onload = checkSession;
    </script>
</body>
</html>
