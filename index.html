<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مِحراب</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        :root {
            --primary: #075b46;
            --primary-dark: #064b3b;
            --background: #f5f5f0;
            --text: #183b30;
            --muted: #74847d;
            --border: #e7e9e4;
            --white: #ffffff;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: var(--background);
            color: var(--text);
            font-family: Tahoma, Arial, sans-serif;
            direction: rtl;
        }

        button,
        input,
        select {
            font: inherit;
        }

        button {
            cursor: pointer;
        }

        .top-nav {
            position: sticky;
            top: 0;
            z-index: 100;
            height: 54px;
            padding: 0 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(245, 245, 240, 0.96);
        }

        .nav-right,
        .nav-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .brand {
            color: var(--primary);
            font-weight: bold;
            font-size: 1rem;
        }

        .hamburger {
            border: 0;
            background: transparent;
            color: var(--primary);
            font-size: 21px;
            padding: 4px;
        }

        .login-link {
            border: 0;
            background: transparent;
            color: var(--primary);
            font-size: 0.8rem;
            padding: 6px 0;
        }

        #user-status {
            color: var(--muted);
            font-size: 0.75rem;
        }

        .sidebar {
            position: fixed;
            top: 0;
            right: -270px;
            z-index: 1002;
            width: 260px;
            height: 100%;
            padding-top: 65px;
            background: var(--primary-dark);
            transition: right 0.25s ease;
        }

        .sidebar.active {
            right: 0;
        }

        .sidebar a {
            display: block;
            padding: 16px 20px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.12);
            color: white;
            text-decoration: none;
            cursor: pointer;
        }

        .overlay {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 1001;
            background: rgba(0, 0, 0, 0.4);
        }

        .overlay.active {
            display: block;
        }

        .page {
            display: none;
            width: min(100%, 520px);
            min-height: calc(100vh - 54px);
            margin: 0 auto;
            padding: 12px 16px 30px;
        }

        .page.active {
            display: block;
        }

        .welcome-card {
            padding: 20px 18px;
            margin: 3px 0 15px;
            border-radius: 17px;
            background: linear-gradient(135deg, #08765a, #07513f);
            color: white;
            box-shadow: 0 6px 16px rgba(7, 91, 70, 0.12);
        }

        .welcome-card h1 {
            margin: 0 0 8px;
            font-size: 1.15rem;
        }

        .welcome-card p {
            margin: 0;
            color: #e5f0eb;
            font-size: 0.78rem;
            line-height: 1.8;
        }

        .mosque-cards {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .mosque-card {
            min-height: 126px;
            padding: 15px 12px;
            border: 1px solid rgba(0, 0, 0, 0.025);
            border-radius: 14px;
            background: var(--white);
            text-align: center;
            box-shadow: 0 3px 12px rgba(0, 0, 0, 0.035);
        }

        .mosque-icon {
            margin-bottom: 4px;
            font-size: 1.7rem;
        }

        .mosque-card h2 {
            margin: 5px 0 11px;
            color: var(--text);
            font-size: 0.9rem;
        }

        .btn-primary {
            border: 0;
            border-radius: 8px;
            padding: 9px 15px;
            background: var(--primary);
            color: white;
            font-size: 0.78rem;
            font-weight: bold;
        }

        .btn-primary:hover {
            background: var(--primary-dark);
        }

        .home-section {
            margin-top: 18px;
        }

        .home-section h2 {
            margin: 0 0 5px;
            font-size: 1.05rem;
        }

        .section-subtitle {
            margin: 0 0 12px;
            color: var(--muted);
            font-size: 0.8rem;
        }

        .filter-row {
            display: flex;
            gap: 8px;
            margin-bottom: 14px;
        }

        .filter-row select {
            min-width: 0;
            flex: 1;
            padding: 9px 10px;
            border: 1px solid var(--border);
            border-radius: 9px;
            background: white;
            color: var(--text);
            font-size: 0.75rem;
        }

        .recitation-card {
            margin-bottom: 10px;
            padding: 13px;
            border-radius: 12px;
            background: white;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.04);
        }

        .recitation-info {
            margin-bottom: 9px;
            font-size: 0.85rem;
            font-weight: bold;
        }

        audio {
            width: 100%;
            height: 38px;
        }

        .mosque-heading {
            margin: 10px 0 16px;
            text-align: center;
            font-size: 1.15rem;
        }

        .auth-container {
            margin: 35px auto;
            padding: 24px 20px;
            border-radius: 15px;
            background: white;
            box-shadow: 0 3px 12px rgba(0, 0, 0, 0.05);
            text-align: center;
        }

        .auth-container h2 {
            margin-top: 0;
            color: var(--primary);
        }

        .auth-container input {
            width: 100%;
            margin: 7px 0;
            padding: 12px;
            border: 1px solid var(--border);
            border-radius: 9px;
            background: white;
        }

        .auth-main-btn {
            width: 100%;
            margin-top: 8px;
        }

        .auth-toggle {
            margin: 15px 0 0;
            color: var(--primary);
            font-size: 0.85rem;
            cursor: pointer;
        }

        .empty-message {
            padding: 14px;
            color: var(--muted);
            font-size: 0.85rem;
            text-align: center;
        }

        @media (min-width: 600px) {
            .page {
                padding-top: 20px;
            }

            .mosque-cards {
                flex-direction: row;
            }

            .mosque-card {
                flex: 1;
            }
        }
    </style>
</head>

<body>
    <nav class="top-nav">
        <div class="nav-right">
            <button class="hamburger" aria-label="فتح القائمة"
                    onclick="toggleSidebar()">☰</button>
            <span class="brand">مِحراب</span>
        </div>

        <div class="nav-left">
            <span id="user-status"></span>
            <button class="login-link" id="login-link"
                    onclick="showPage('auth')">دخول / حساب</button>
            <button class="login-link" id="logout-btn"
                    onclick="handleLogout()" style="display:none">خروج</button>
        </div>
    </nav>

    <div class="overlay" id="overlay" onclick="toggleSidebar()"></div>

    <aside class="sidebar" id="sidebar">
        <a onclick="showPage('home')">الرئيسية</a>
        <a onclick="showPage('haram')">المسجد الحرام</a>
        <a onclick="showPage('nabawi')">المسجد النبوي</a>
    </aside>

    <main>
        <section id="home" class="page active">
            <div class="welcome-card">
                <h1>أستمع إلى تلاوات الحرمين</h1>
                <p>كن قريبًا من تلاوات المسجد الحرام والمسجد النبوي، واستمع إلى التلاوات المختارة.</p>
            </div>

            <div class="mosque-cards">
                <article class="mosque-card">
                    <div class="mosque-icon">🕋</div>
                    <h2>المسجد الحرام</h2>
                    <button class="btn-primary" onclick="showPage('haram')">
                        عرض التلاوات
                    </button>
                </article>

                <article class="mosque-card">
                    <div class="mosque-icon">🕌</div>
                    <h2>المسجد النبوي</h2>
                    <button class="btn-primary" onclick="showPage('nabawi')">
                        عرض التلاوات
                    </button>
                </article>
            </div>

            <section class="home-section">
                <h2>تلاوة اليوم</h2>
                <p class="section-subtitle">أحدث التلاوات</p>

                <div class="filter-row">
                    <select id="home-mosque-filter" onchange="filterHomeRecitations()">
                        <option value="all">كل المساجد</option>
                        <option value="المسجد الحرام">المسجد الحرام</option>
                        <option value="المسجد النبوي">المسجد النبوي</option>
                    </select>

                    <select id="home-prayer-filter" onchange="filterHomeRecitations()">
                        <option value="all">كل الصلوات</option>
                        <option value="الفجر">الفجر</option>
                        <option value="المغرب">المغرب</option>
                        <option value="العشاء">العشاء</option>
                    </select>
                </div>

                <div id="home-recitations-list"></div>
            </section>
        </section>

        <section id="mosque-view" class="page">
            <h2 id="mosque-title" class="mosque-heading"></h2>

            <div class="filter-row">
                <select id="prayer-filter" onchange="filterRecitations()">
                    <option value="all">كل الصلوات</option>
                    <option value="الفجر">الفجر</option>
                    <option value="المغرب">المغرب</option>
                    <option value="العشاء">العشاء</option>
                </select>
            </div>

            <div id="recitations-list"></div>
        </section>

        <section id="auth" class="page">
            <div class="auth-container">
                <h2 id="auth-title">تسجيل الدخول</h2>
                <input type="email" id="auth-email" placeholder="الإيميل">
                <input type="password" id="auth-password" placeholder="كلمة المرور">
                <button class="btn-primary auth-main-btn" id="auth-main-btn"
                        onclick="handleAuth()">دخول</button>
                <p class="auth-toggle" id="auth-toggle"
                   onclick="toggleAuthMode()">إنشاء حساب</p>
            </div>
        </section>
    </main>

    <script>
        const SUPABASE_URL = 'https://wbjgotyjxlnkgxkamvet.supabase.co/';
        const SUPABASE_KEY = 'sb_publishable_odJSX2nIpjMMndVAzJSnWA_o5DuKrcH';

        const supabaseClient = supabase.createClient(
            SUPABASE_URL,
            SUPABASE_KEY
        );

        let currentMosque = '';
        let isLoginMode = true;
        let currentUser = null;
        let allRecs = [];

        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('active');
            document.getElementById('overlay').classList.toggle('active');
        }

        function closeSidebar() {
            document.getElementById('sidebar').classList.remove('active');
            document.getElementById('overlay').classList.remove('active');
        }

        function showPage(id) {
            closeSidebar();

            document.querySelectorAll('.page').forEach(page => {
                page.classList.remove('active');
            });

            if (id === 'haram' || id === 'nabawi') {
                currentMosque = id === 'haram'
                    ? 'المسجد الحرام'
                    : 'المسجد النبوي';

                document.getElementById('mosque-title').textContent =
                    currentMosque;

                document.getElementById('mosque-view').classList.add('active');
                loadRecs();
                return;
            }

            const page = document.getElementById(id);
            if (page) page.classList.add('active');

            if (id === 'home') {
                loadAllRecitations();
            }
        }

        function toggleAuthMode() {
            isLoginMode = !isLoginMode;

            document.getElementById('auth-title').textContent =
                isLoginMode ? 'تسجيل الدخول' : 'إنشاء حساب';

            document.getElementById('auth-main-btn').textContent =
                isLoginMode ? 'دخول' : 'تسجيل';

            document.getElementById('auth-toggle').textContent =
                isLoginMode ? 'إنشاء حساب' : 'العودة إلى تسجيل الدخول';
        }

        async function handleAuth() {
            const email = document.getElementById('auth-email').value.trim();
            const password = document.getElementById('auth-password').value;

            if (!email || !password) {
                alert('أدخل الإيميل وكلمة المرور.');
                return;
            }

            const button = document.getElementById('auth-main-btn');
            button.disabled = true;

            try {
                if (isLoginMode) {
                    const { error } =
                        await supabaseClient.auth.signInWithPassword({
                            email,
                            password
                        });

                    if (error) throw error;

                    await checkSession();
                    showPage('home');
                } else {
                    const { error } = await supabaseClient.auth.signUp({
                        email,
                        password
                    });

                    if (error) throw error;

                    alert('تم إنشاء الحساب. تحقق من بريدك الإلكتروني إذا طُلب منك ذلك.');
                    isLoginMode = true;
                    toggleAuthMode();
                }
            } catch (error) {
                alert(error.message || 'حدث خطأ، حاول مرة أخرى.');
            } finally {
                button.disabled = false;
            }
        }

        async function checkSession() {
            const { data, error } = await supabaseClient.auth.getSession();

            if (error) {
                console.error('تعذر التحقق من الجلسة:', error.message);
                return;
            }

            currentUser = data.session?.user || null;

            document.getElementById('user-status').textContent =
                currentUser ? currentUser.email : '';

            document.getElementById('login-link').style.display =
                currentUser ? 'none' : 'inline';

            document.getElementById('logout-btn').style.display =
                currentUser ? 'inline' : 'none';
        }

        async function handleLogout() {
            const { error } = await supabaseClient.auth.signOut();

            if (error) {
                alert(error.message);
                return;
            }

            currentUser = null;
            await checkSession();
            showPage('home');
        }

        async function loadAllRecitations() {
            const container = document.getElementById('home-recitations-list');
            container.innerHTML = '<p class="empty-message">جارٍ تحميل التلاوات...</p>';

            const { data, error } = await supabaseClient
                .from('recitations')
                .select('*')
                .order('created_at', { ascending: false });

            if (error) {
                console.error('تعذر تحميل التلاوات:', error.message);
                container.innerHTML =
                    '<p class="empty-message">تعذر تحميل التلاوات حاليًا.</p>';
                return;
            }

            allRecs = data || [];
            filterHomeRecitations();
        }

        function filterHomeRecitations() {
            const mosque = document.getElementById('home-mosque-filter').value;
            const prayer = document.getElementById('home-prayer-filter').value;
            const container = document.getElementById('home-recitations-list');

            const filtered = allRecs.filter(item => {
                const matchesMosque =
                    mosque === 'all' || item.mosque === mosque;

                const matchesPrayer =
                    prayer === 'all' || item.prayer === prayer;

                return matchesMosque && matchesPrayer;
            });

            renderRecitations(filtered, container);
        }

        async function loadRecs() {
            const container = document.getElementById('recitations-list');
            container.innerHTML = '<p class="empty-message">جارٍ تحميل التلاوات...</p>';

            const { data, error } = await supabaseClient
                .from('recitations')
                .select('*')
                .eq('mosque', currentMosque)
                .order('created_at', { ascending: false });

            if (error) {
                console.error('تعذر تحميل التلاوات:', error.message);
                container.innerHTML =
                    '<p class="empty-message">تعذر تحميل التلاوات حاليًا.</p>';
                return;
            }

            allRecs = data || [];
            filterRecitations();
        }

        function filterRecitations() {
            const prayer = document.getElementById('prayer-filter').value;

            const filtered = prayer === 'all'
                ? allRecs
                : allRecs.filter(item => item.prayer === prayer);

            renderRecitations(
                filtered,
                document.getElementById('recitations-list')
            );
        }

        function renderRecitations(items, container) {
            container.replaceChildren();

            if (!items.length) {
                container.innerHTML =
                    '<p class="empty-message">لا توجد تلاوات مطابقة حاليًا.</p>';
                return;
            }

            items.forEach(item => {
                const card = document.createElement('article');
                card.className = 'recitation-card';

                const info = document.createElement('div');
                info.className = 'recitation-info';

                const mosqueText = item.mosque ? ` — ${item.mosque}` : '';
                info.textContent =
                    `${item.reciter || ''} — ${item.surah || ''} (${item.prayer || ''})${mosqueText}`;

                const audio = document.createElement('audio');
                audio.controls = true;
                audio.src = item.storage_path || '';

                card.append(info, audio);
                container.appendChild(card);
            });
        }

        window.addEventListener('load', async () => {
            await checkSession();
            await loadAllRecitations();
        });
    </script>
</body>
</html>
